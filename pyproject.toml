[project]
name = "meanrev"
version = "0.1.0"
description = "Meanrev Autonomous AI Trading Agent — Alpaca Paper (CLI: meanrev)"
readme = "How_To_use.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "alpaca-py==0.44.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "langchain==1.3.18",
    "langchain-core==1.6.1",
    "langchain-openai==1.6.0",
    "langchain-anthropic==1.7.0",
    "langgraph==1.2.11",
    "pandas==3.0.5",
    "pandas-ta==0.4.71b0",
    "prompt_toolkit==3.0.53",
    "rich==14.3.4",
    "questionary==2.1.1",
    "redis==8.1.0",
    "tenacity==9.1.4",
    "tiktoken==0.14.0",
    "requests==2.34.2",
    "apscheduler==3.10.4",
]

[project.scripts]
meanrev = "backend.cli.__main__:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
"*" = ["*.md"]
